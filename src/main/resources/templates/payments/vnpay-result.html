<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0a1628 0%, #1a2d5a 50%, #0d2137 100%);
        min-height: 100vh;
    }

    .result-wrapper {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    .result-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        width: 100%;
        max-width: 460px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.9); }
        to   { opacity: 1; transform: scale(1); }
    }

    /* === SUCCESS === */
    .result-header-success {
        background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 60%, #388e3c 100%);
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .result-header-success::before {
        content: '';
        position: absolute;
        top: -60%;
        left: -60%;
        width: 220%;
        height: 220%;
        background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 55%);
        animation: rotateBg 8s linear infinite;
    }

    @keyframes rotateBg {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    /* === FAILED === */
    .result-header-failed {
        background: linear-gradient(135deg, #7f0000 0%, #b71c1c 60%, #c62828 100%);
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .result-header-failed::before {
        content: '';
        position: absolute;
        top: -60%;
        left: -60%;
        width: 220%;
        height: 220%;
        background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 55%);
    }

    /* === Icon vòng tròn === */
    .status-icon-wrap {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: rgba(255,255,255,0.15);
        border: 3px solid rgba(255,255,255,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
        position: relative;
        z-index: 1;
        animation: iconPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    @keyframes iconPop {
        from { opacity: 0; transform: scale(0); }
        to   { opacity: 1; transform: scale(1); }
    }

    .status-icon-wrap i {
        font-size: 2.5rem;
        color: white;
    }

    .result-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: white;
        margin: 0 0 0.4rem;
        position: relative;
        z-index: 1;
    }

    .result-subtitle {
        font-size: 0.875rem;
        color: rgba(255,255,255,0.75);
        margin: 0;
        position: relative;
        z-index: 1;
    }

    /* === Body === */
    .result-body {
        padding: 1.75rem 2rem 0.5rem;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.8rem 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .detail-row:last-child {
        border-bottom: none;
    }

    .detail-label {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.45);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .detail-label i {
        width: 16px;
        text-align: center;
    }

    .detail-value {
        font-size: 0.875rem;
        font-weight: 600;
        color: rgba(255,255,255,0.88);
    }

    .detail-value.code-style {
        font-family: 'Courier New', monospace;
        font-size: 0.8rem;
        background: rgba(129,212,250,0.1);
        color: #81d4fa;
        padding: 3px 8px;
        border-radius: 6px;
    }

    .detail-value.success-color { color: #a5d6a7; }
    .detail-value.error-color   { color: #ef9a9a; }

    /* === Status badge === */
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
    }

    .badge-success { background: rgba(76,175,80,0.2); color: #a5d6a7; }
    .badge-failed  { background: rgba(244,67,54,0.2);  color: #ef9a9a; }

    /* === Action area === */
    .result-actions {
        padding: 1.25rem 2rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .btn-primary-action {
        background: linear-gradient(135deg, #1565c0, #0d47a1);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 0.9rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.25s;
        box-shadow: 0 6px 20px rgba(21,101,192,0.35);
    }

    .btn-primary-action:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(21,101,192,0.5);
        color: white;
        text-decoration: none;
    }

    .btn-success-action {
        background: linear-gradient(135deg, #2e7d32, #1b5e20);
        box-shadow: 0 6px 20px rgba(46,125,50,0.35);
    }

    .btn-success-action:hover {
        box-shadow: 0 10px 30px rgba(46,125,50,0.5);
    }

    .btn-secondary-action {
        background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.6);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 0.75rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s;
    }

    .btn-secondary-action:hover {
        background: rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.9);
        border-color: rgba(255,255,255,0.2);
        text-decoration: none;
    }

    /* === Confetti particles (chỉ hiện khi thành công) === */
    .confetti-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
    }

    .confetti-particle {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
        0%   { top: -10%; opacity: 1; transform: rotate(0deg); }
        100% { top: 110%; opacity: 0; transform: rotate(720deg); }
    }
</style>

<body>
<nav th:replace="~{fragments/header :: header}"></nav>

<!-- Confetti (chỉ show khi thành công) -->
<div class="confetti-container" id="confettiContainer" th:if="${success}"></div>

<div class="result-wrapper">
    <div class="result-card">

        <!-- SUCCESS Header -->
        <div th:if="${success}" class="result-header-success">
            <div class="status-icon-wrap">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="result-title">Thanh toán thành công!</h1>
            <p class="result-subtitle">Đơn hàng của bạn đã được xác nhận</p>
        </div>

        <!-- FAILED Header -->
        <div th:unless="${success}" class="result-header-failed">
            <div class="status-icon-wrap">
                <i class="fas fa-times"></i>
            </div>
            <h1 class="result-title">Thanh toán thất bại</h1>
            <p class="result-subtitle">Giao dịch không thể hoàn tất</p>
        </div>

        <!-- Detail rows -->
        <div class="result-body">

            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-hashtag"></i> Mã giao dịch</span>
                <span class="detail-value code-style" th:text="${txnRef}">VNP...</span>
            </div>

            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-credit-card"></i> Phương thức</span>
                <span class="detail-value">VNPay</span>
            </div>

            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-info-circle"></i> Trạng thái</span>
                <span th:if="${success}" class="detail-value">
                    <span class="status-badge badge-success">
                        <i class="fas fa-check-circle"></i> Thành công
                    </span>
                </span>
                <span th:unless="${success}" class="detail-value">
                    <span class="status-badge badge-failed">
                        <i class="fas fa-times-circle"></i> Thất bại
                        <span th:if="${responseCode}" th:text="'(Mã: ' + ${responseCode} + ')'"></span>
                    </span>
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-clock"></i> Thời gian</span>
                <span class="detail-value" id="txnTime"></span>
            </div>

        </div>

        <!-- Action buttons -->
        <div class="result-actions">
            <!-- Thành công: xem đơn hàng -->
            <th:block th:if="${success}">
                <a th:href="${orderId != null ? '/orders/detail/' + orderId : '/orders/my-orders'}"
                   class="btn-primary-action btn-success-action">
                    <i class="fas fa-file-invoice"></i>
                    Xem chi tiết đơn hàng
                    <i class="fas fa-arrow-right"></i>
                </a>
            </th:block>

            <!-- Thất bại: retry -->
            <th:block th:unless="${success}">
                <a th:href="${orderId != null ? '/payments/retry/' + orderId : '/orders/my-orders'}"
                   class="btn-primary-action">
                    <i class="fas fa-redo"></i>
                    Thử thanh toán lại
                </a>
            </th:block>

            <!-- Luôn có nút về trang đơn hàng -->
            <a href="/orders/my-orders" class="btn-secondary-action">
                <i class="fas fa-list-alt"></i>
                Xem tất cả đơn hàng
            </a>
        </div>

    </div>
</div>

<script th:inline="javascript">
    // Hiển thị thời gian giao dịch
    const now = new Date();
    const timeStr = now.toLocaleString('vi-VN', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    document.getElementById('txnTime').textContent = timeStr;

    // Confetti animation khi thành công
    const isSuccess = /*[[${success}]]*/ false;
    if (isSuccess) {
        const container = document.getElementById('confettiContainer');
        const colors = ['#4CAF50', '#8BC34A', '#CDDC39', '#FFC107', '#00BCD4', '#2196F3', '#9C27B0', '#FF5722'];
        for (let i = 0; i < 80; i++) {
            const particle = document.createElement('div');
            particle.className = 'confetti-particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.width = (Math.random() * 8 + 6) + 'px';
            particle.style.height = (Math.random() * 8 + 6) + 'px';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            particle.style.animationDelay = (Math.random() * 1.5) + 's';
            if (container) container.appendChild(particle);
        }
        // Ẩn confetti sau 4s
        setTimeout(() => { if (container) container.style.display = 'none'; }, 4000);
    }
</script>
</body>
</html>
