<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout_admin}">
<head>
    <title>Quản lý đơn hàng</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
        <h2>Danh sách đơn hàng</h2>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white pt-3 pb-0">
            <ul class="nav nav-tabs border-bottom-0">
                <li class="nav-item">
                    <a th:classappend="${currentStatus == 'ALL' ? 'active fw-bold' : ''}" class="nav-link" th:href="@{/admin/orders(status='ALL')}">Tất cả</a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentStatus == 'PENDING' ? 'active fw-bold text-warning' : 'text-secondary'}" class="nav-link" th:href="@{/admin/orders(status='PENDING')}">Chờ xử lý</a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentStatus == 'CONFIRMED' ? 'active fw-bold text-primary' : 'text-secondary'}" class="nav-link" th:href="@{/admin/orders(status='CONFIRMED')}">Đã xác nhận</a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentStatus == 'ACTIVE' ? 'active fw-bold text-info' : 'text-secondary'}" class="nav-link" th:href="@{/admin/orders(status='ACTIVE')}">Đang thuê</a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentStatus == 'COMPLETED' ? 'active fw-bold text-success' : 'text-secondary'}" class="nav-link" th:href="@{/admin/orders(status='COMPLETED')}">Hoàn thành</a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${currentStatus == 'CANCELLED' ? 'active fw-bold text-danger' : 'text-secondary'}" class="nav-link" th:href="@{/admin/orders(status='CANCELLED')}">Đã hủy</a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Ngày tạo</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">

                        <td class="fw-bold" th:text="${order.orderCode}"></td>

                        <td th:text="${order.userName}"></td>

                        <td th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}"></td>

                        <td class="text-danger fw-bold"
                            th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}">
                        </td>

                        <td>
                            <span class="badge"
                                  th:classappend="${
                                    order.status.name() == 'PENDING' ? 'bg-warning text-dark' :
                                    (order.status.name() == 'CONFIRMED' ? 'bg-primary' :
                                    (order.status.name() == 'ACTIVE' ? 'bg-info text-dark' :
                                    (order.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-danger')))
                                  }"
                                  th:text="${order.status}">
                            </span>
                        </td>

                        <td>
                            <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-eye"></i> Chi tiết
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(orders)}" class="text-center py-4 text-muted">
                <p>Chưa có đơn hàng nào trong hệ thống.</p>
            </div>

            <!-- Phân trang -->
            <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/orders(status=${currentStatus}, page=${currentPage - 1})}" tabindex="-1">Trang trước</a>
                    </li>
                    
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                        class="page-item" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/admin/orders(status=${currentStatus}, page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/orders(status=${currentStatus}, page=${currentPage + 1})}">Trang sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
