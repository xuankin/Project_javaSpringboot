<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout_admin}">
<head>
    <title>Quản lý Mã giảm giá</title>
    <style>
        .card-header-icon { display: flex; align-items: center; }
        .card-header-icon .fas { margin-right: 10px; }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2"><i class="fas fa-tags"></i> Quản lý Mã giảm giá</h1>
    </div>

    <!-- Thông báo -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i> <strong>Lỗi:</strong> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- Form thêm mã mới -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header card-header-icon">
                    <i class="fas fa-plus-circle"></i>
                    <h5 class="mb-0">Thêm mã mới</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/discounts/add}" th:object="${newDiscount}" method="post">
                        <div class="mb-3">
                            <label for="code" class="form-label">Mã giảm giá</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                                <input type="text" class="form-control" id="code" th:field="*{code}" placeholder="VD: SALE50" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="discountPercentage" class="form-label">Số tiền giảm (vnđ)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-money-bill-wave"></i></span>
                                <input type="number" class="form-control" id="discountPercentage" th:field="*{discountPercentage}" placeholder="VD: 50000" required min="1">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="expiryDate" class="form-label">Ngày hết hạn</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                                <input type="date" class="form-control" id="expiryDate" th:field="*{expiryDate}"
                                       th:min="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Lưu mã</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Danh sách mã -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header card-header-icon">
                    <i class="fas fa-list-ul"></i>
                    <h5 class="mb-0">Danh sách mã hiện có</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Mã</th>
                                <th>Số tiền (VNĐ)</th>
                                <th>Ngày hết hạn</th>
                                <th class="text-center">Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="discount : ${discounts}">
                                <td th:text="${discount.id}"></td>
                                <td class="fw-bold" th:text="${discount.code}"></td>
                                <td th:text="${#numbers.formatDecimal(discount.discountPercentage, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                                <td th:text="${#temporals.format(discount.expiryDate, 'dd-MM-yyyy')}"></td>
                                <td class="text-center">
                                    <span th:if="${discount.isActive and !discount.expiryDate.isBefore(T(java.time.LocalDate).now())}"
                                          class="badge bg-success">Hoạt động</span>
                                    <span th:unless="${discount.isActive and !discount.expiryDate.isBefore(T(java.time.LocalDate).now())}"
                                          class="badge bg-danger">Hết hạn</span>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-outline-warning me-1 btn-edit"
                                            data-bs-toggle="modal" data-bs-target="#editModal"
                                            th:data-id="${discount.id}"
                                            th:data-code="${discount.code}"
                                            th:data-amount="${discount.discountPercentage}"
                                            th:data-expiry="${discount.expiryDate}"
                                            th:data-active="${discount.isActive}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <form th:action="@{/admin/discounts/delete/{id}(id=${discount.id})}" method="post"
                                          class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa mã giảm giá này?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${discounts.isEmpty()}">
                                <td colspan="6" class="text-center text-muted p-4">
                                    <i class="fas fa-box-open fa-2x mb-2"></i>
                                    <p>Chưa có mã giảm giá nào.</p>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal (nằm TRONG fragment content) -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/discounts/edit}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel"><i class="fas fa-edit"></i> Sửa mã giảm giá</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit-id" name="id">
                        <div class="mb-3">
                            <label for="edit-code" class="form-label">Mã giảm giá</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                                <input type="text" class="form-control" id="edit-code" name="code" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="edit-amount" class="form-label">Số tiền giảm (vnđ)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-money-bill-wave"></i></span>
                                <input type="number" class="form-control" id="edit-amount" name="discountPercentage" required min="1">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="edit-expiryDate" class="form-label">Ngày hết hạn</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                                <input type="date" class="form-control" id="edit-expiryDate" name="expiryDate"
                                       th:min="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}" required>
                            </div>
                        </div>
                        <div class="form-check form-switch mt-3">
                            <input type="checkbox" class="form-check-input" id="edit-isActive" name="active" value="true">
                            <label class="form-check-label" for="edit-isActive">Cho phép mã hoạt động</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="page-scripts">
<script>
    // Dùng data-* attributes thay vì th:onclick để tránh lỗi parse Thymeleaf
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.btn-edit').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.getElementById('edit-id').value = this.dataset.id;
                document.getElementById('edit-code').value = this.dataset.code;
                document.getElementById('edit-amount').value = this.dataset.amount;
                document.getElementById('edit-expiryDate').value = this.dataset.expiry;
                document.getElementById('edit-isActive').checked = (this.dataset.active === 'true');
            });
        });
    });
</script>
</th:block>

</body>
</html>
