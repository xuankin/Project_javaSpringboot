<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-light shadow-sm" style="background-color: #F0E6F7 !important;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="fas fa-motorcycle me-2"></i>MotoRental</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/vehicles">Thuê xe</a></li>

                <li sec:authorize="isAuthenticated() and !hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" href="/tracking"><i class="fas fa-route me-1"></i>Lịch trình</a>
                </li>

                <li sec:authorize="isAuthenticated() and !hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" href="/orders/my-orders"><i class="fas fa-list-ul me-1"></i>Đơn hàng</a>
                </li>
                <li sec:authorize="isAuthenticated() and !hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" href="/cart"><i class="fas fa-shopping-cart me-1"></i>Giỏ hàng</a>
                </li>
                
                <li sec:authorize="isAuthenticated() and !hasRole('ADMIN')" class="nav-item dropdown mx-1 position-relative">
                    <a class="nav-link" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-bell fs-5 text-secondary"></i>
                        <span id="header-unread-badge" class="position-absolute badge rounded-pill bg-danger" style="display: none; font-size: 0.6rem; top: 0px; right: -5px;">
                            0
                        </span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="notificationDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                        <li><h6 class="dropdown-header fw-bold text-dark border-bottom pb-2">Thông báo</h6></li>
                        <div id="notification-list">
                            <li id="empty-notification-msg"><span class="dropdown-item text-muted text-center py-3 small">Không có thông báo mới</span></li>
                        </div>
                        <li><hr class="dropdown-divider m-0"></li>
                        <li><a class="dropdown-item text-center text-primary py-2 small fw-bold bg-light" href="/user/chat">Mở Chat Hỗ Trợ</a></li>
                    </ul>
                </li>


                <li sec:authorize="!isAuthenticated()" class="nav-item">
                    <a class="nav-link" href="/login">Đăng nhập</a>
                </li>
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <a class="nav-link text-info" href="/profile" sec:authentication="name">User</a>
                </li>
                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link text-danger">Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<script sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
    // Tải script StompJS và gọi connect
    function loadChatScripts() {
        if (typeof Stomp === 'undefined') {
            const sockjs = document.createElement('script');
            sockjs.src = 'https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js';
            document.head.appendChild(sockjs);

            const stompScript = document.createElement('script');
            stompScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js';
            stompScript.onload = connectGlobalNotifications;
            document.head.appendChild(stompScript);
        } else {
            connectGlobalNotifications();
        }
    }

    var globalStompClient = null;
    function connectGlobalNotifications() {
        if (window.location.pathname === '/user/chat') return; // Không cần thiết nếu đang ở trang chat
        
        // Timeout đợi SockJS load
        if (typeof SockJS === 'undefined') {
            setTimeout(connectGlobalNotifications, 100);
            return;
        }

        var socket = new SockJS('/ws');
        globalStompClient = Stomp.over(socket);
        globalStompClient.debug = null;
        globalStompClient.connect({}, function (frame) {
            globalStompClient.subscribe('/user/queue/notifications', function (payload) {
                // Nhận thông báo realtime
                handleNewNotification(JSON.parse(payload.body));
            });
        });
    }

    function handleNewNotification(msg) {
        if (msg.type === 'NEW_MESSAGE') {
            checkUnreadMsgs(); // Fetch lại tổng badge
            var title = msg.title ? msg.title : "Tin nhắn mới từ Hỗ Trợ";
            var content = msg.content ? msg.content : "Bạn có một tin nhắn mới.";
            addNotificationItem(title, content);
        }
    }

    function addNotificationItem(title, content) {
        const list = document.getElementById('notification-list');
        const emptyMsg = document.getElementById('empty-notification-msg');
        if(emptyMsg) emptyMsg.style.display = 'none';

        const item = document.createElement('li');
        item.innerHTML = `
            <a class="dropdown-item d-flex align-items-start py-2 border-bottom" href="/user/chat" style="white-space: normal;">
                <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center mt-1 me-2" style="width: 30px; height: 30px; flex-shrink: 0;">
                    <i class="fas fa-headset" style="font-size: 12px;"></i>
                </div>
                <div>
                    <h6 class="mb-0 text-dark small fw-bold">${title}</h6>
                    <small class="text-muted" style="font-size: 12px;">${content}</small>
                </div>
            </a>
        `;
        list.prepend(item);
        
        // Giữ tối đa 5 thông báo
        if (list.children.length > 5) {
            list.removeChild(list.lastChild);
        }
    }

    function checkUnreadMsgs() {
        fetch('/api/notifications/unread-total')
            .then(res => res.json())
            .then(count => {
                var flBadge = document.getElementById('floating-unread-badge');
                if(flBadge) {
                    flBadge.innerText = count > 9 ? '9+' : count;
                    flBadge.style.display = count > 0 ? 'inline-block' : 'none';
                }
                
                var hdrBadge = document.getElementById('header-unread-badge');
                if(hdrBadge) {
                    hdrBadge.innerText = count > 9 ? '9+' : count;
                    hdrBadge.style.display = count > 0 ? 'inline-block' : 'none';
                }
            }).catch(e => console.log('Lỗi API notifications:', e));
    }
    function updateMyRealtimeLocation() {
        if (!("geolocation" in navigator)) return;
        navigator.geolocation.getCurrentPosition(function(position) {
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            
            const headers = { 'Content-Type': 'application/json' };
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            fetch('/api/tracking/update-location', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                })
            }).catch(e => console.error('Tracking update failed:', e));
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkUnreadMsgs();
        loadChatScripts();

        // Update location every 30 seconds
        updateMyRealtimeLocation();
        setInterval(updateMyRealtimeLocation, 30000); 
    });
</script>
</html>
