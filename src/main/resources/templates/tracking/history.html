<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white border-0 py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 class="mb-0 fw-bold text-primary">
                                <i class="fas fa-route me-2"></i>Lịch trình di chuyển
                            </h4>
                            <form action="/tracking" method="get" class="d-flex gap-2">
                                <div class="input-group">
                                    <span class="input-group-text">Từ</span>
                                    <input type="date" name="startDate" class="form-control" th:value="${startDate}">
                                    <span class="input-group-text">Đến</span>
                                    <input type="date" name="endDate" class="form-control" th:value="${endDate}">
                                </div>
                                <button type="submit" class="btn btn-primary text-nowrap">
                                    <i class="fas fa-filter me-1"></i>Lọc
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <!-- Map Container -->
                        <div id="map" style="width: 100%; height: 500px; border-radius: 0 0 10px 10px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="mb-0 fw-bold">Chi tiết vị trí trong ngày</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Tọa độ</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="point : ${history}">
                                    <td th:text="${#temporals.format(point.timestamp, 'HH:mm:ss dd/MM/yyyy')}"></td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${point.latitude + ', ' + point.longitude}"></span>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-info" 
                                                th:onclick="'centerMap(' + ${point.latitude} + ', ' + ${point.longitude} + ')'">
                                            <i class="fas fa-map-marker-alt"></i> Xem
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(history)}">
                                    <td colspan="3" class="text-center text-muted py-4">Không có dữ liệu di chuyển trong ngày này.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const historyData = /*[[${historyDataJson}]]*/ [];
        
        // Cấu hình bản đồ Leaflet
        const defaultCenter = [10.762622, 106.660172]; // HCM default
        const mapCenter = historyData.length > 0 ? [historyData[0].latitude, historyData[0].longitude] : defaultCenter;
        
        const map = L.map('map').setView(mapCenter, 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        if (historyData && historyData.length > 0) {
            const latLngs = historyData.map(p => [p.latitude, p.longitude]);
            
            // Vẽ đường kết nối các điểm (Dùng đường bộ thực tế qua OSRM API - KHÔNG CẦN MAPBOX TOKEN)
            let polyline = null;
            if (latLngs.length > 1) {
                // Tách 25 điểm tối đa để gọi OSRM Route API (OSRM OSRM Demo API giới hạn)
                let sampledCoords = historyData;
                if (sampledCoords.length > 25) {
                    const step = Math.ceil(sampledCoords.length / 25);
                    sampledCoords = sampledCoords.filter((_, index) => index % step === 0).slice(0, 24);
                    sampledCoords.push(historyData[historyData.length - 1]);
                }
                const coordsString = sampledCoords.map(c => c.longitude + ',' + c.latitude).join(';');
                const url = `https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson`;

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                            // Vẽ đường cong thực tế
                            polyline = L.geoJSON(data.routes[0].geometry, {
                                style: { color: '#007bff', weight: 6, opacity: 0.8, lineJoin: 'round' }
                            }).addTo(map);
                            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                        } else {
                            // Fallback đường thẳng
                            polyline = L.polyline(latLngs, { color: '#007bff', weight: 6, opacity: 0.8, lineJoin: 'round' }).addTo(map);
                        }
                    })
                    .catch(err => {
                        console.error('Lỗi lấy dữ liệu OSRM', err);
                        // Fallback đường thẳng
                        polyline = L.polyline(latLngs, { color: '#007bff', weight: 6, opacity: 0.8, lineJoin: 'round' }).addTo(map);
                    });
            }

            // Marker điểm bắt đầu (màu xanh lá)
            const startIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            // Marker điểm kết thúc (màu đỏ)
            const endIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            // Thêm marker điểm đầu
            L.marker(latLngs[0], {icon: startIcon})
                .addTo(map)
                .bindPopup('<b>Điểm bắt đầu</b><br>' + historyData[0].timestamp);

            // Thêm marker điểm cuối nếu có > 1 điểm
            if (latLngs.length > 1) {
                L.marker(latLngs[latLngs.length - 1], {icon: endIcon})
                    .addTo(map)
                    .bindPopup('<b>Điểm cuối</b><br>' + historyData[historyData.length - 1].timestamp);
                
                // Tự động zoom vừa vặn (Đã được gọi bên trong fetch() nếu có OSRM, phần này fallback)
                setTimeout(() => {
                    if (polyline) map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                }, 500);
            } else {
                map.setView(latLngs[0], 16);
            }
        }

        function centerMap(lat, lng) {
            map.flyTo([lat, lng], 16, {
                animate: true,
                duration: 1.5
            });
            
            // Highlight điểm vừa click với popup tạm
            L.popup()
                .setLatLng([lat, lng])
                .setContent('Vị trí đã chọn')
                .openOn(map);
        }
        /*]]>*/
    </script>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
