<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Hỗ Trợ - MotoRental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-light: #818cf8;
            --surface: #ffffff;
            --bg: #f1f5f9;
            --text: #1e293b;
            --muted: #64748b;
            --bubble-admin: #ffffff;
            --bubble-user: #4f46e5;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ===== LAYOUT ===== */
        .chat-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 860px;
            margin: 0 auto;
            background: var(--surface);
            box-shadow: 0 0 40px rgba(79, 70, 229, 0.12);
        }

        /* ===== HEADER ===== */
        .chat-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(79,70,229,0.3);
        }
        .chat-header .agent-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .agent-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            position: relative;
        }
        .agent-avatar::after {
            content: '';
            width: 11px;
            height: 11px;
            background: #22c55e;
            border-radius: 50%;
            border: 2px solid white;
            position: absolute;
            bottom: 1px;
            right: 1px;
        }
        .agent-name { font-weight: 700; font-size: 1rem; margin-bottom: 1px; }
        .agent-status { font-size: 0.75rem; opacity: 0.85; }

        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        /* ===== MESSAGES AREA ===== */
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 16px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ===== SYSTEM MESSAGES ===== */
        .system-msg {
            text-align: center;
            padding: 6px 14px;
            background: rgba(79,70,229,0.08);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            align-self: center;
            margin: 8px 0;
        }

        /* ===== BUBBLES ===== */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 2px;
            animation: msgIn 0.2s ease-out;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-row.from-user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .msg-row.from-user .msg-avatar { display: none; }

        .msg-bubble {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        /* Admin bubble */
        .msg-row.from-admin .msg-bubble {
            background: var(--bubble-admin);
            color: var(--text);
            border-radius: 4px 18px 18px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        /* User bubble */
        .msg-row.from-user .msg-bubble {
            background: var(--bubble-user);
            color: white;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 2px 8px rgba(79,70,229,0.3);
        }

        .msg-time {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 4px;
            padding: 0 4px;
        }
        .msg-row.from-user .msg-time { text-align: right; }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: none;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 4px;
        }
        .typing-indicator .msg-avatar {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }
        .typing-dots {
            background: white;
            border-radius: 4px 18px 18px 18px;
            padding: 12px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--primary-light);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ===== LOADING ===== */
        .loading-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 12px;
            color: var(--muted);
        }
        .loader-ring {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== INPUT AREA ===== */
        .chat-input-area {
            background: white;
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .input-group-chat {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 50px;
            padding: 6px 8px 6px 16px;
            transition: border-color 0.2s;
        }
        .input-group-chat:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        #chat-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.9rem;
            color: var(--text);
        }
        #chat-input::placeholder { color: var(--muted); }
        #send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
        #send-btn:active { transform: scale(0.95); }
        #send-btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        /* Connection indicator */
        .conn-bar {
            text-align: center;
            font-size: 0.75rem;
            padding: 4px;
            display: none;
        }
        .conn-bar.connecting { background: #fef3c7; color: #92400e; display: block; }
        .conn-bar.error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <!-- HEADER -->
    <div class="chat-header">
        <div class="agent-info">
            <div class="agent-avatar">
                <i class="fas fa-headset"></i>
            </div>
            <div>
                <div class="agent-name">Hỗ Trợ MotoRental</div>
                <div class="agent-status"><i class="fas fa-circle" style="font-size:7px; color:#22c55e;"></i> Trực tuyến</div>
            </div>
        </div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left me-1"></i>Quay lại</a>
    </div>

    <!-- Connection bar -->
    <div class="conn-bar connecting" id="conn-bar">
        <i class="fas fa-spinner fa-spin me-1"></i>Đang kết nối...
    </div>

    <!-- MESSAGES -->
    <div class="chat-messages" id="chat-messages">
        <div class="loading-area" id="loading-area">
            <div class="loader-ring"></div>
            <span>Đang tải lịch sử chat...</span>
        </div>
    </div>

    <!-- INPUT -->
    <div class="chat-input-area">
        <div class="input-group-chat">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." disabled>
            <button id="send-btn" title="Gửi tin nhắn" disabled>
                <i class="fas fa-paper-plane" style="font-size:14px;"></i>
            </button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script th:inline="javascript">
/*<![CDATA[*/
var stompClient = null;
var connBar = document.getElementById('conn-bar');
var chatBox = document.getElementById('chat-messages');
var loadingArea = document.getElementById('loading-area');
var chatInput = document.getElementById('chat-input');
var sendBtn = document.getElementById('send-btn');

// ---- WEBSOCKET ----
function connect() {
    connBar.className = 'conn-bar connecting';
    var socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function(frame) {
        connBar.style.display = 'none';
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();

        // Nhận reply từ Admin
        stompClient.subscribe('/user/queue/reply', function(payload) {
            var msg = JSON.parse(payload.body);
            hideTyping();
            appendMessage({ content: msg.content, adminSender: true, timestamp: new Date().toISOString() });
        });

        // Load lịch sử sau khi connect thành công
        loadHistory();

    }, function(err) {
        connBar.className = 'conn-bar error';
        connBar.innerHTML = '<i class="fas fa-exclamation-circle me-1"></i>Mất kết nối. <a href="" style="color:inherit">Thử lại</a>';
        console.error('WebSocket error:', err);
    });
}

// ---- LOAD HISTORY ----
function loadHistory() {
    fetch('/api/chat/my-history')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            // Xóa loading
            loadingArea.remove();

            // Tin nhắn chào mừng hệ thống
            appendSystemMsg('Xin chào! Chúng tôi có thể hỗ trợ gì cho bạn hôm nay?');

            if (data.length === 0) {
                appendSystemMsg('Đây là lần đầu bạn chat. Hãy gửi tin nhắn để bắt đầu!');
            } else {
                data.forEach(function(msg) { appendMessage(msg); });
            }
            scrollBottom();
        })
        .catch(function(err) {
            console.error(err);
            loadingArea.innerHTML = '<i class="fas fa-exclamation-triangle text-warning"></i><span>Không thể tải lịch sử.</span>';
        });
}

// ---- SEND ----
function sendMessage() {
    var content = chatInput.value.trim();
    if (!content || !stompClient) return;

    var chatMsg = { content: content, type: 'CHAT' };
    stompClient.send('/app/chat.sendMessage', {}, JSON.stringify(chatMsg));

    appendMessage({ content: content, adminSender: false, timestamp: new Date().toISOString() });
    chatInput.value = '';
    sendBtn.disabled = true;
    setTimeout(function() { sendBtn.disabled = false; }, 300);
    scrollBottom();

    // Giả lập typing indicator admin (chỉ để làm đẹp demo)
    showTyping();
    setTimeout(hideTyping, 2000);
}

// ---- RENDER ----
function appendSystemMsg(text) {
    var el = document.createElement('div');
    el.className = 'system-msg';
    el.textContent = text;
    chatBox.appendChild(el);
}

function appendMessage(msg) {
    var isAdmin = msg.adminSender;
    var wrapper = document.createElement('div');

    // Row
    var row = document.createElement('div');
    row.className = 'msg-row ' + (isAdmin ? 'from-admin' : 'from-user');

    // Avatar (only for admin)
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = '<i class="fas fa-headset" style="font-size:13px;"></i>';

    // Bubble
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = escapeHtml(msg.content).replace(/\n/g, '<br>');

    if (isAdmin) {
        row.appendChild(avatar);
    }
    row.appendChild(bubble);
    chatBox.appendChild(row);

    // Time label
    if (msg.timestamp) {
        var timeEl = document.createElement('div');
        timeEl.className = 'msg-time';
        timeEl.textContent = formatTime(msg.timestamp);
        chatBox.appendChild(timeEl);
        timeEl.style.textAlign = isAdmin ? 'left' : 'right';
        timeEl.style.paddingLeft = isAdmin ? '40px' : '0';
        timeEl.style.paddingRight = isAdmin ? '0' : '4px';
    }

    scrollBottom();
}

// Typing indicator
var typingEl = null;
function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.className = 'typing-indicator';
    typingEl.style.display = 'flex';
    typingEl.innerHTML = '<div class="msg-avatar"><i class="fas fa-headset" style="font-size:13px;"></i></div><div class="typing-dots"><span></span><span></span><span></span></div>';
    chatBox.appendChild(typingEl);
    scrollBottom();
}
function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
}

function scrollBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}

function formatTime(iso) {
    try {
        var d = new Date(iso);
        var h = d.getHours().toString().padStart(2,'0');
        var m = d.getMinutes().toString().padStart(2,'0');
        return h + ':' + m;
    } catch(e) { return ''; }
}

function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

// Events
chatInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
});
sendBtn.addEventListener('click', sendMessage);

// Start
connect();
/*]]>*/
</script>
</body>
</html>
