<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-id-card"></i> Hồ sơ cá nhân</h4>
                    <div>
                        <span th:each="role : ${userDto.roles}"
                              class="badge bg-warning text-dark me-1"
                              th:text="${role}"></span>
                    </div>
                </div>

                <div class="card-body p-4">
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/user/profile/update}" method="post" th:object="${userDto}" enctype="multipart/form-data">

                        <div class="text-center mb-4 position-relative">
                            <img id="avatarPreview"
                                 th:src="${userDto.avatarUrl != null ? userDto.avatarUrl : 'https://ui-avatars.com/api/?name=' + userDto.fullName + '&background=0D6EFD&color=fff&size=128'}"
                                 class="rounded-circle img-thumbnail shadow-sm border-2" 
                                 style="width: 140px; height: 140px; object-fit: cover;" alt="Avatar">
                            
                            <div class="mt-3">
                                <label for="avatarInput" class="btn btn-sm btn-outline-primary rounded-pill fw-bold shadow-sm px-3" style="cursor: pointer;">
                                    <i class="fas fa-camera me-1"></i> Tải ảnh lên
                                </label>
                                <input type="file" id="avatarInput" name="avatarFile" class="d-none" accept="image/*" onchange="previewAvatar(this)">
                            </div>

                            <div class="mt-2">
                                <span th:if="*{isActive}" class="badge bg-success">Đang hoạt động</span>
                                <span th:unless="*{isActive}" class="badge bg-danger">Đã khóa</span>
                                <span th:if="*{isScammed}" class="badge bg-dark text-warning"><i class="fas fa-skull-crossbones"></i> Scam</span>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted">Tên đăng nhập</label>
                                <input type="text" class="form-control bg-light" th:field="*{username}" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted">Email</label>
                                <input type="email" class="form-control bg-light" th:field="*{email}" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Họ và tên</label>
                                <input type="text" class="form-control" th:field="*{fullName}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="text" class="form-control" th:field="*{phoneNumber}">
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Trang chủ
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    function previewAvatar(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatarPreview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
