<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title>Checkout - MotoRental</title>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: header}"></nav>

<div class="container mt-5 mb-5">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i> <strong>Lỗi:</strong> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <h2 class="mb-4 text-center">Xác nhận đặt xe</h2>

    <div class="row">
        <div class="col-md-5 order-md-2 mb-4">
            <h4 class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-primary">Đơn hàng của bạn</span>
                <span class="badge bg-primary rounded-pill" th:text="${cart.totalItems}">0</span>
            </h4>
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between lh-sm" th:each="item : ${cart.items}">
                    <div>
                        <h6 class="my-0" th:text="${item.vehicleName}">Tên xe</h6>
                        <small class="text-muted">
                            <span th:text="${#temporals.format(item.startDate, 'dd/MM/yyyy')}"></span> đến
                            <span th:text="${#temporals.format(item.endDate, 'dd/MM/yyyy')}"></span>
                        </small>
                    </div>
                    <span class="text-muted" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'">Price</span>
                </li>

                <li class="list-group-item d-flex justify-content-between">
                    <span>Tạm tính (VND)</span>
                    <strong id="original-total" th:data-total="${cart.totalAmount}" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></strong>
                </li>
                <li id="discount-row" class="list-group-item d-flex justify-content-between text-success" style="display: none;">
                    <span>Giảm giá</span>
                    <strong id="discount-amount"></strong>
                </li>

                <li class="list-group-item d-flex justify-content-between bg-light">
                    <div class="text-success">
                        <h6 class="my-0">Tổng cộng (VND)</h6>
                    </div>
                    <strong id="final-total" class="text-success" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'">Total</strong>
                </li>
            </ul>

            <div class="card p-2">
                <div class="input-group">
                    <input type="text" class="form-control" id="discount-code-input" placeholder="Mã giảm giá">
                    <button type="button" class="btn btn-secondary" id="apply-discount-btn">Áp dụng</button>
                </div>
                <div id="discount-message" class="mt-2"></div>
            </div>
        </div>

        <div class="col-md-7 order-md-1">
            <h4 class="mb-3">Thông tin thanh toán</h4>
            <div class="card p-4 shadow-sm border-0 bg-light">
                <form th:action="@{/orders/create}" method="post" th:object="${order}">
                    <input type="hidden" th:field="*{discountCode}" id="hidden-discount-code"/>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nơi nhận xe <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{pickupLocation}" class="form-control"
                               placeholder="Nhập địa chỉ bạn muốn nhận xe (VD: Sân bay, Khách sạn...)" required>
                        <div class="invalid-feedback">Vui lòng nhập nơi nhận xe.</div>
                        <div th:if="${#fields.hasErrors('pickupLocation')}" th:errors="*{pickupLocation}" class="text-danger small mt-1"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ghi chú đơn hàng (Tùy chọn)</label>
                        <textarea th:field="*{notes}" class="form-control" rows="3" placeholder="Ví dụ: Giao xe lúc 9h sáng..."></textarea>
                    </div>

                    <hr class="my-4">

                    <h5 class="mb-3">Phương thức thanh toán</h5>

                    <div class="my-3">
                        <div class="form-check">
                            <input id="credit" name="paymentMethod" type="radio" class="form-check-input" value="CASH" th:field="*{paymentMethod}" checked required>
                            <label class="form-check-label" for="credit">Tiền mặt (Thanh toán khi nhận xe)</label>
                        </div>
                        <div class="form-check">
                            <input id="vnpay" name="paymentMethod" type="radio" class="form-check-input" value="VNPAY" th:field="*{paymentMethod}" required>
                            <label class="form-check-label" for="vnpay">VNPay (Thanh toán Online)</label>
                            <img src="https://vnpay.vn/assets/images/logo-icon/logo-primary.svg" alt="VNPay" style="height: 20px; margin-left: 10px;">
                        </div>
                    </div>

                    <hr class="my-4">

                    <button class="w-100 btn btn-primary btn-lg" type="submit">Xác nhận đặt hàng</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('apply-discount-btn').addEventListener('click', function() {
        const codeInput = document.getElementById('discount-code-input');
        const messageDiv = document.getElementById('discount-message');
        const code = codeInput.value.trim();

        if (!code) {
            messageDiv.innerHTML = '<span class="text-danger">Vui lòng nhập mã.</span>';
            return;
        }

        fetch('/api/discounts/validate?code=' + encodeURIComponent(code))
        .then(response => {
            if (!response.ok && response.status !== 400) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            if (data.valid) {
                messageDiv.innerHTML = `<span class="text-success">${data.message}</span>`;
                applyDiscount(data.discountPercentage, code);
            } else {
                messageDiv.innerHTML = `<span class="text-danger">${data.message}</span>`;
                resetDiscount();
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.innerHTML = '<span class="text-danger">Lỗi khi kiểm tra mã.</span>';
            resetDiscount();
        });
    });

    function formatCurrency(number) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(number);
    }

    function applyDiscount(percentage, code) {
        const originalTotalEl = document.getElementById('original-total');
        const originalTotal = parseFloat(originalTotalEl.getAttribute('data-total'));

        const discountAmount = percentage > originalTotal ? originalTotal : percentage;
        const finalTotal = originalTotal - discountAmount;

        document.getElementById('discount-amount').textContent = `- ${formatCurrency(discountAmount)}`;
        document.getElementById('discount-row').style.display = 'flex';
        document.getElementById('final-total').textContent = formatCurrency(finalTotal);
        document.getElementById('hidden-discount-code').value = code;
    }

    function resetDiscount() {
        const originalTotalEl = document.getElementById('original-total');
        const originalTotal = parseFloat(originalTotalEl.getAttribute('data-total'));

        document.getElementById('discount-row').style.display = 'none';
        document.getElementById('final-total').textContent = formatCurrency(originalTotal);
        document.getElementById('hidden-discount-code').value = '';
    }
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
